[package]
name = "block-coders"
version = "0.2.0"
edition = "2024"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }

[profile.dev.package."*"]
opt-level = 2

# One codegen unit with full LTO: the web download is ~4% smaller and the level
# simulations ~25% faster than the defaults, for a slower release build (~20 s vs ~10 s).
# Nothing catches panics or relies on Drop, so aborting drops the unwinding code.
[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
